<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- Partial mitigation for "Missing Security Headers" — the directives
       below ARE honored when delivered via <meta>, unlike X-Frame-Options,
       X-Content-Type-Options, and CSP's frame-ancestors directive, which
       browsers only honor from a real HTTP header and silently ignore
       here. Those three genuinely require a hosting platform capable of
       setting response headers; this covers what's actually achievable
       from a static file alone. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Partial mitigation for Clickjacking (Finding 2.1/2.5) — a classic
       frame-busting check: if this page is ever loaded inside another
       site's iframe, break out of it immediately. This defeats their
       exact demonstrated PoC. It's a pre-CSP-era technique though, not a
       complete substitute for the real fix — the CSP frame-ancestors /
       X-Frame-Options header, which (like the headers noted above) can
       only be delivered by a hosting platform capable of setting real
       HTTP response headers, not by any static-file-only technique. -->
  <script src="js/anti-clickjacking.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · TREAT COE</title>
  <link rel="stylesheet" href="assets/style.css">

</head>

<body class="login-page">
  <header class="site-header">
    <a class="logo" href="login.html">
      <img src="assets/treat.png" alt="TREAT logo">
      <span class="lt"><i>Tx’s Repository For Enterprise Applications Testing</i></span>
    </a>
  </header>

  <section class="hero login-hero">
    <div class="login-card">
      <!-- <img src="assets/treat.png" alt="TREAT logo" class="login-logo"> -->
      <h2 class="login-heading">To View The Repository, Please Log In</h2>
      <button class="signin-btn login-signin-btn" data-sign-in="1"
        style="background-color: #167D8A; color: #FFFFFF; border: none; padding: 13px 26px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;">
        Sign In
      </button>
      <p class="sso-note login-note">Having trouble signing in? Contact your COE admin.</p>
    </div>
  </section>


  <footer class="site-footer">
    <div class="footer-text">
      TREAT Center of Excellence — Internal Knowledge Repository &middot; Documents hosted in
      <b>SharePoint / Teams.</b>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"
    integrity="sha384-YnOjsoOxSYo65h1BXWnSq24bFbqW8HfzMWSEQxYEMRmjW9Vl1J3HZI3iZxqNYvIi"
    crossorigin="anonymous"></script>
  <script src="js/site.js?v=20260903162922"></script>
  <script src="js/auth.js?v=20260903162922"></script>
  <script src="js/graph.js?v=20260903162922"></script>
</body>

</html>
