<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · TREAT COE</title>
  <link rel="stylesheet" href="assets/style.css">

</head>

<body class="login-page">
  <header class="site-header">
    <a class="logo" href="login.html">
      <img src="assets/treat.png" alt="TREAT logo">
      <span class="lt"><i>Tx’s Repository For Enterprise Applications Testing</i></span>
    </a>
  </header>

  <section class="hero login-hero">
    <div class="login-card">
      <!-- <img src="assets/treat.png" alt="TREAT logo" class="login-logo"> -->
      <h2 class="login-heading">To View the Repository, Please Log In</h2>
      <button class="signin-btn login-signin-btn" onclick="signIn()"
        style="background-color: #167D8A; color: #FFFFFF; border: none; padding: 13px 26px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;">
        Sign In
      </button>
      <p class="sso-note login-note"> <b> Having trouble signing in? Contact your TREAT admin. </b> </p>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-text">
      TREAT Center of Excellence — Internal Knowledge Repository &middot; Documents hosted in
      <b>SharePoint / Teams.</b>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
  <script src="js/site.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/graph.js"></script>
</body>

</html>
